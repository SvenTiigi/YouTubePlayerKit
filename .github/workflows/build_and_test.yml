name: Build and Test

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/build_and_test.yml"
      - "!Sources/Documentation.docc/**"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/build_and_test.yml"
      - "!Sources/Documentation.docc/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iOS:
    name: Build and test on iOS ${{ matrix.os }} (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - runner: macos-26
            xcode: "26.6"
            destination: iPhone 17 Pro
            os: "26.5"
          - runner: macos-15
            xcode: "16.4"
            destination: iPhone 16 Pro
            os: "18.5"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Build
        run: |
          set -o pipefail &&\
          xcodebuild build-for-testing\
            -scheme YouTubePlayerKit\
            -sdk iphonesimulator\
            -destination "platform=iOS Simulator,name=${{ matrix.destination }},OS=${{ matrix.os }}"\
          | xcbeautify --renderer github-actions
      - name: Test
        run: |
          set -o pipefail &&\
          xcodebuild test-without-building\
            -scheme YouTubePlayerKit\
            -sdk iphonesimulator\
            -destination "platform=iOS Simulator,name=${{ matrix.destination }},OS=${{ matrix.os }}"\
          | xcbeautify --renderer github-actions
  macOS:
    name: Build and test on macOS (Xcode ${{ matrix.xcode }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - xcode: "26.6"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v --enable-code-coverage
      - name: Report coverage
        run: |
          build_path="$(swift build --show-bin-path)"
          xcrun llvm-cov report \
            "$build_path/YouTubePlayerKitPackageTests.xctest/Contents/MacOS/YouTubePlayerKitPackageTests" \
            -instr-profile "$build_path/codecov/default.profdata" \
            -ignore-filename-regex '/Tests/|\.derived/'
