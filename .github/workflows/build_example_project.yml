name: Build Example Project

on:
  workflow_dispatch:
  push:
    paths:
      - "Example/**"
      - "Sources/**"
      - "Package.swift"
      - ".github/workflows/build_example_project.yml"
      - "!Sources/Documentation.docc/**"
  pull_request:
    paths:
      - "Example/**"
      - "Sources/**"
      - "Package.swift"
      - ".github/workflows/build_example_project.yml"
      - "!Sources/Documentation.docc/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build example project (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/example-logs"
          xcodebuild -version | tee "$RUNNER_TEMP/example-logs/environment.log"
          xcodebuild -showsdks | tee -a "$RUNNER_TEMP/example-logs/environment.log"
      - name: Build
        run: |
          xcodebuild build \
            -project Example/Example.xcodeproj \
            -scheme Example \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ExampleDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Example.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/example-logs/build.log" | xcbeautify --renderer github-actions
      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: example-ios-build
          path: |
            ${{ runner.temp }}/example-logs
            ${{ runner.temp }}/Example.xcresult
          retention-days: 14
          if-no-files-found: warn
